<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" role="img" aria-label="CCP and workspace mind map"><title>CCP and workspace mind map</title><rect width="100%" height="100%" fill="#fff7ed"/><circle cx="360" cy="210" r="70" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="360" y="214" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="800" fill="#1e1b4b">CCP and workspace</text><rect x="80" y="60" width="160" height="64" rx="16" fill="#e0e7ff" stroke="#4338ca" stroke-width="3"/><text text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b"><tspan x="160.0" y="76.0">The CCP is a web</tspan><tspan x="160.0" y="92.0">app with a</tspan><tspan x="160.0" y="108.0">telephone inside</tspan></text><rect x="640" y="60" width="160" height="64" rx="16" fill="#cffafe" stroke="#0e7490" stroke-width="3"/><text text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b"><tspan x="720.0" y="68.0">The workspace is</tspan><tspan x="720.0" y="84.0">where the</tspan><tspan x="720.0" y="100.0">ecosystem becomes</tspan><tspan x="720.0" y="116.0">visible</tspan></text><rect x="70" y="340" width="160" height="64" rx="16" fill="#fce7f3" stroke="#9d174d" stroke-width="3"/><text text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b"><tspan x="150.0" y="356.0">Streams is the</tspan><tspan x="150.0" y="372.0">supported way to</tspan><tspan x="150.0" y="388.0">embed the CCP</tspan></text><rect x="650" y="340" width="160" height="64" rx="16" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b"><tspan x="730.0" y="364.0">VDI, VPN, and the</tspan><tspan x="730.0" y="380.0">audio path</tspan></text><text x="24" y="442" font-family="system-ui,sans-serif" font-size="13" fill="#4338ca">If UDP 3478 is blocked, the agent is signed in and cannot hear the customer.</text></svg>