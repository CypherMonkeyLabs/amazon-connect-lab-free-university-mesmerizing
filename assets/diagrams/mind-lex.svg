<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" role="img" aria-label="Lex V2 mind map"><title>Lex V2 mind map</title><rect width="100%" height="100%" fill="#fff7ed"/><circle cx="360" cy="210" r="70" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="360" y="214" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="800" fill="#1e1b4b">Lex V2</text><rect x="80" y="60" width="160" height="64" rx="16" fill="#e0e7ff" stroke="#4338ca" stroke-width="3"/><text text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b"><tspan x="160.0" y="84.0">Get customer input</tspan><tspan x="160.0" y="100.0">is the Lex block</tspan></text><rect x="640" y="60" width="160" height="64" rx="16" fill="#cffafe" stroke="#0e7490" stroke-width="3"/><text text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b"><tspan x="720.0" y="76.0">Slots become</tspan><tspan x="720.0" y="92.0">attributes or they</tspan><tspan x="720.0" y="108.0">vanish</tspan></text><rect x="70" y="340" width="160" height="64" rx="16" fill="#fce7f3" stroke="#9d174d" stroke-width="3"/><text text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b"><tspan x="150.0" y="356.0">Fallback is a</tspan><tspan x="150.0" y="372.0">route, not a</tspan><tspan x="150.0" y="388.0">failure</tspan></text><text x="24" y="442" font-family="system-ui,sans-serif" font-size="13" fill="#4338ca">Self-service only works if the intent you branch on is the intent Lex actually returned.</text></svg>