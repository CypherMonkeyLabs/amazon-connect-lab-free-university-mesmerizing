<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" role="img" aria-label="Integrations mind map"><title>Integrations mind map</title><rect width="100%" height="100%" fill="#fff7ed"/><circle cx="360" cy="210" r="70" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="360" y="214" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="800" fill="#1e1b4b">Integrations</text><rect x="80" y="60" width="160" height="64" rx="16" fill="#e0e7ff" stroke="#4338ca" stroke-width="3"/><text text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b"><tspan x="160.0" y="84.0">Salesforce: CTI</tspan><tspan x="160.0" y="100.0">Adapter and SCC-AC</tspan></text><rect x="640" y="60" width="160" height="64" rx="16" fill="#cffafe" stroke="#0e7490" stroke-width="3"/><text text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b"><tspan x="720.0" y="92.0">ServiceNow Voice</tspan></text><rect x="70" y="340" width="160" height="64" rx="16" fill="#fce7f3" stroke="#9d174d" stroke-width="3"/><text text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b"><tspan x="150.0" y="356.0">Teams is a chat</tspan><tspan x="150.0" y="372.0">client in the</tspan><tspan x="150.0" y="388.0">published pattern</tspan></text><rect x="650" y="340" width="160" height="64" rx="16" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b"><tspan x="730.0" y="364.0">CUCM and Webex</tspan><tspan x="730.0" y="380.0">beside Connect</tspan></text><rect x="360" y="40" width="160" height="64" rx="16" fill="#d1fae5" stroke="#047857" stroke-width="3"/><text text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b"><tspan x="440.0" y="56.0">Salesforce starts</tspan><tspan x="440.0" y="72.0">as a CCP embed in</tspan><tspan x="440.0" y="88.0">a sandbox</tspan></text><rect x="360" y="380" width="160" height="64" rx="16" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/><text text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b"><tspan x="440.0" y="388.0">Twilio Flex is a</tspan><tspan x="440.0" y="404.0">different product,</tspan><tspan x="440.0" y="420.0">documented on its</tspan><tspan x="440.0" y="436.0">own site</tspan></text><text x="24" y="442" font-family="system-ui,sans-serif" font-size="13" fill="#4338ca">The CRM, the PBX, and the chat client each own a different seam. Mixing them up builds a transfer that pops the wrong record.</text></svg>