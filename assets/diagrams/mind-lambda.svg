<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" role="img" aria-label="Lambda mind map"><title>Lambda mind map</title><rect width="100%" height="100%" fill="#fff7ed"/><circle cx="360" cy="210" r="70" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="360" y="214" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="800" fill="#1e1b4b">Lambda</text><rect x="80" y="60" width="160" height="64" rx="16" fill="#e0e7ff" stroke="#4338ca" stroke-width="3"/><text text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b"><tspan x="160.0" y="84.0">The response</tspan><tspan x="160.0" y="100.0">contract</tspan></text><rect x="640" y="60" width="160" height="64" rx="16" fill="#cffafe" stroke="#0e7490" stroke-width="3"/><text text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b"><tspan x="720.0" y="76.0">When the work is</tspan><tspan x="720.0" y="92.0">slower than eight</tspan><tspan x="720.0" y="108.0">seconds</tspan></text><rect x="70" y="340" width="160" height="64" rx="16" fill="#fce7f3" stroke="#9d174d" stroke-width="3"/><text text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b"><tspan x="150.0" y="348.0">Association,</tspan><tspan x="150.0" y="364.0">resource policy,</tspan><tspan x="150.0" y="380.0">and the log that</tspan><tspan x="150.0" y="396.0">says AccessDenied</tspan></text><text x="24" y="442" font-family="system-ui,sans-serif" font-size="13" fill="#4338ca">Most &#x27;random&#x27; flow errors are a Lambda response that missed the timeout or the shape Connect accepts.</text></svg>