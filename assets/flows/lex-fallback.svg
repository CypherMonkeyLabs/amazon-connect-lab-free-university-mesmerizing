<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" role="img" aria-label="Fallback is a route, not a failure flow"><title>Fallback is a route, not a failure flow</title><rect width="100%" height="100%" fill="#fff7ed"/><rect x="180" y="24" width="400" height="78" rx="16" fill="#e0e7ff" stroke="#4338ca" stroke-width="3"/><text text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b"><tspan x="380.0" y="63.0">Miss</tspan></text><text x="180" y="120" font-family="system-ui,sans-serif" font-size="13" fill="#4338ca">Fallback intent.</text><rect x="180" y="134" width="400" height="78" rx="16" fill="#cffafe" stroke="#0e7490" stroke-width="3"/><text text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b"><tspan x="380.0" y="173.0">Once more</tspan></text><text x="180" y="230" font-family="system-ui,sans-serif" font-size="13" fill="#4338ca">A shorter prompt.</text><path d="M 380 102 V 134" fill="none" stroke="#7c3aed" stroke-width="4"/><rect x="180" y="244" width="400" height="78" rx="16" fill="#fce7f3" stroke="#9d174d" stroke-width="3"/><text text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b"><tspan x="380.0" y="283.0">Then</tspan></text><text x="180" y="340" font-family="system-ui,sans-serif" font-size="13" fill="#4338ca">Queue or callback.</text><path d="M 380 212 V 244" fill="none" stroke="#7c3aed" stroke-width="4"/><rect x="180" y="354" width="400" height="78" rx="16" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b"><tspan x="380.0" y="393.0">Log</tspan></text><text x="180" y="450" font-family="system-ui,sans-serif" font-size="13" fill="#4338ca">Count the misses.</text><path d="M 380 322 V 354" fill="none" stroke="#7c3aed" stroke-width="4"/><circle r="8" fill="#db2777"><animateMotion dur="5s" repeatCount="