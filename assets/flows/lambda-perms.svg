<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Association, resource policy, and the log that says AccessDenied flow"><title>Association, resource policy, and the log that says AccessDenied flow</title><rect width="100%" height="100%" fill="#fff7ed"/><rect x="180" y="24" width="400" height="78" rx="16" fill="#e0e7ff" stroke="#4338ca" stroke-width="3"/><text text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b"><tspan x="380.0" y="63.0">Read the flow log</tspan></text><text x="180" y="120" font-family="system-ui,sans-serif" font-size="13" fill="#4338ca">AccessDenied or not.</text><rect x="180" y="134" width="400" height="78" rx="16" fill="#cffafe" stroke="#0e7490" stroke-width="3"/><text text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b"><tspan x="380.0" y="173.0">Fix the policy</tspan></text><text x="180" y="230" font-family="system-ui,sans-serif" font-size="13" fill="#4338ca">Or the return shape.</text><path d="M 380 102 V 134" fill="none" stroke="#7c3aed" stroke-width="4"/><rect x="180" y="244" width="400" height="78" rx="16" fill="#fce7f3" stroke="#9d174d" stroke-width="3"/><text text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b"><tspan x="380.0" y="283.0">Retest</tspan></text><text x="180" y="340" font-family="system-ui,sans-serif" font-size="13" fill="#4338ca">One ContactId.</text><path d="M 380 212 V 244" fill="none" stroke="#7c3aed" stroke-width="4"/><circle r="8" fill="#db2777"><animateMotion dur="5s" repeatCount="indefinite" path="M 380 63 L 380 173 L 380 283"/></circle><text x="24" y="382" font-family="system-ui,sans-serif" font-size="13" fill="#4338ca">Animated study flow. Confirm the cited source before relying on it.</text></svg>